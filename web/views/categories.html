<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>🤖 Bot Admin</h1>
            <span>Management Panel</span>
        </div>
        <ul class="nav-menu">
            <li><a href="/dashboard"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Dashboard</a></li>
            <li><a href="/categories" class="active"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>Kategori</a></li>
            <li><a href="/products"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>Produk</a></li>
            <li><a href="/users"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>Users</a></li>
            <li><a href="/transactions"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>Transaksi</a></li>
            <li><a href="/settings"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Settings</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/logout" style="color:var(--text-sidebar);text-decoration:none;font-size:13px;display:flex;align-items:center;gap:8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Logout
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="hamburger" onclick="toggleSidebar()">☰</button>
                <h2>Kategori</h2>
            </div>
            <div class="topbar-actions">
                <button class="btn btn-primary" onclick="openModal('addModal')">+ Tambah</button>
                <button class="theme-toggle" onclick="toggleTheme()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                </button>
            </div>
        </div>

        <div class="content">
            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Nama Kategori</th>
                                <th>Jumlah Produk</th>
                                <th>Dibuat</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="4" class="empty-state"><p>Loading...</p></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Tambah Kategori</h3>
                <button class="modal-close" onclick="closeModal('addModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Nama Kategori</label>
                    <input type="text" class="form-control" id="addName" placeholder="Contoh: Game, Streaming, dll">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('addModal')">Batal</button>
                <button class="btn btn-primary" onclick="addCategory()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Edit Kategori</h3>
                <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Nama Kategori</label>
                    <input type="text" class="form-control" id="editName">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('editModal')">Batal</button>
                <button class="btn btn-primary" onclick="updateCategory()">Update</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        async function loadCategories() {
            try {
                const data = await api('/categories/api');
                const tbody = document.getElementById('tableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-state"><p>Belum ada kategori</p></td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(c => `
                    <tr>
                        <td><strong>${c.name}</strong></td>
                        <td>${c.product_count} produk</td>
                        <td>${formatDate(c.created_at)}</td>
                        <td>
                            <button class="btn btn-sm btn-outline" onclick="editCategory(${c.id}, '${c.name}')">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCategory(${c.id}, '${c.name}')">Hapus</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {}
        }

        async function addCategory() {
            const name = document.getElementById('addName').value;
            if (!name.trim()) return showToast('Nama kategori wajib diisi', 'error');
            await api('/categories/api', { method: 'POST', body: JSON.stringify({ name }) });
            showToast('Kategori berhasil ditambahkan');
            closeModal('addModal');
            document.getElementById('addName').value = '';
            loadCategories();
        }

        function editCategory(id, name) {
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = name;
            openModal('editModal');
        }

        async function updateCategory() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('editName').value;
            if (!name.trim()) return showToast('Nama kategori wajib diisi', 'error');
            await api(`/categories/api/${id}`, { method: 'PUT', body: JSON.stringify({ name }) });
            showToast('Kategori berhasil diupdate');
            closeModal('editModal');
            loadCategories();
        }

        async function deleteCategory(id, name) {
            if (!confirmAction(`Hapus kategori "${name}"? Semua produk di dalamnya juga akan terhapus.`)) return;
            await api(`/categories/api/${id}`, { method: 'DELETE' });
            showToast('Kategori berhasil dihapus');
            loadCategories();
        }

        loadCategories();
    </script>
</body>
</html>
