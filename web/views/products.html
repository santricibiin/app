<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>🤖 Bot Admin</h1>
            <span>Management Panel</span>
        </div>
        <ul class="nav-menu">
            <li><a href="/dashboard"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Dashboard</a></li>
            <li><a href="/categories"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>Kategori</a></li>
            <li><a href="/products" class="active"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>Produk</a></li>
            <li><a href="/users"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>Users</a></li>
            <li><a href="/transactions"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>Transaksi</a></li>
            <li><a href="/settings"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Settings</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/logout" style="color:var(--text-sidebar);text-decoration:none;font-size:13px;display:flex;align-items:center;gap:8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Logout
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="hamburger" onclick="toggleSidebar()">☰</button>
                <h2>Produk</h2>
            </div>
            <div class="topbar-actions">
                <button class="btn btn-primary" onclick="showAddProduct()">+ Tambah Produk</button>
                <button class="theme-toggle" onclick="toggleTheme()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                </button>
            </div>
        </div>

        <div class="content">
            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Kode</th>
                                <th>Nama Produk</th>
                                <th>Kategori</th>
                                <th>Harga</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="6" class="empty-state"><p>Loading...</p></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Product Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="productModalTitle">Tambah Produk</h3>
                <button class="modal-close" onclick="closeModal('productModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>Kategori</label>
                    <select class="form-control" id="productCategory"></select>
                </div>
                <div class="form-group">
                    <label>Kode Produk</label>
                    <input type="text" class="form-control" id="productCode" placeholder="Contoh: ML01, NF01">
                </div>
                <div class="form-group">
                    <label>Nama Produk</label>
                    <input type="text" class="form-control" id="productName" placeholder="Nama produk">
                </div>
                <div class="form-group">
                    <label>Harga (Rp)</label>
                    <input type="number" class="form-control" id="productPrice" placeholder="15000">
                </div>
                <div class="form-group">
                    <label>Deskripsi</label>
                    <textarea class="form-control" id="productDesc" placeholder="Deskripsi produk (opsional)"></textarea>
                </div>
                <div class="form-group">
                    <label>Syarat & Ketentuan</label>
                    <textarea class="form-control" id="productSnk" placeholder="S&K pembelian (opsional)"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('productModal')">Batal</button>
                <button class="btn btn-primary" id="productSubmitBtn" onclick="saveProduct()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Stock Modal -->
    <div class="modal-overlay" id="stockModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="stockModalTitle">Kelola Stok</h3>
                <button class="modal-close" onclick="closeModal('stockModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="stockProductId">
                <div class="form-group">
                    <label>Tambah Stok (1 baris = 1 stok)</label>
                    <textarea class="form-control" id="stockData" rows="5" placeholder="akun1@mail.com|pass123&#10;akun2@mail.com|pass456&#10;kode_voucher_001"></textarea>
                </div>
                <button class="btn btn-primary" onclick="addStock()" style="margin-bottom:20px;width:100%;">+ Tambah Stok</button>
                <div class="form-group">
                    <label>Stok Saat Ini</label>
                </div>
                <div id="stockList" style="max-height:200px;overflow-y:auto;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="deleteAllStock()">Hapus Semua Stok</button>
                <button class="btn btn-outline" onclick="closeModal('stockModal')">Tutup</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let categories = [];

        async function loadCategories() {
            categories = await api('/products/api/categories');
        }

        async function loadProducts() {
            try {
                const data = await api('/products/api');
                const tbody = document.getElementById('tableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><p>Belum ada produk</p></td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(p => `
                    <tr>
                        <td><code>${p.code}</code></td>
                        <td><strong>${p.name}</strong></td>
                        <td>${p.category_name || '-'}</td>
                        <td>Rp ${formatPrice(p.price)}</td>
                        <td><span class="badge ${p.stock_count > 0 ? 'badge-success' : 'badge-danger'}">${p.stock_count} stok</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline" onclick="showStock(${p.id}, '${p.name}')">Stok</button>
                            <button class="btn btn-sm btn-outline" onclick="editProduct(${p.id})">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id}, '${p.name}')">Hapus</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {}
        }

        async function showAddProduct() {
            await loadCategories();
            document.getElementById('productModalTitle').textContent = 'Tambah Produk';
            document.getElementById('productId').value = '';
            document.getElementById('productCode').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productDesc').value = '';
            document.getElementById('productSnk').value = '';
            renderCategorySelect('');
            openModal('productModal');
        }

        async function editProduct(id) {
            await loadCategories();
            const products = await api('/products/api');
            const p = products.find(x => x.id === id);
            if (!p) return;
            document.getElementById('productModalTitle').textContent = 'Edit Produk';
            document.getElementById('productId').value = p.id;
            document.getElementById('productCode').value = p.code;
            document.getElementById('productName').value = p.name;
            document.getElementById('productPrice').value = p.price;
            document.getElementById('productDesc').value = p.description || '';
            document.getElementById('productSnk').value = p.snk || '';
            renderCategorySelect(p.category_id);
            openModal('productModal');
        }

        function renderCategorySelect(selected) {
            const sel = document.getElementById('productCategory');
            sel.innerHTML = '<option value="">-- Pilih Kategori --</option>' +
                categories.map(c => `<option value="${c.id}" ${c.id == selected ? 'selected' : ''}>${c.name}</option>`).join('');
        }

        async function saveProduct() {
            const id = document.getElementById('productId').value;
            const data = {
                category_id: document.getElementById('productCategory').value,
                code: document.getElementById('productCode').value,
                name: document.getElementById('productName').value,
                price: document.getElementById('productPrice').value,
                description: document.getElementById('productDesc').value,
                snk: document.getElementById('productSnk').value
            };
            if (!data.category_id || !data.code || !data.name || !data.price) {
                return showToast('Kategori, kode, nama, dan harga wajib diisi', 'error');
            }
            if (id) {
                await api(`/products/api/${id}`, { method: 'PUT', body: JSON.stringify(data) });
                showToast('Produk berhasil diupdate');
            } else {
                await api('/products/api', { method: 'POST', body: JSON.stringify(data) });
                showToast('Produk berhasil ditambahkan');
            }
            closeModal('productModal');
            loadProducts();
        }

        async function deleteProduct(id, name) {
            if (!confirmAction(`Hapus produk "${name}"? Stok juga akan terhapus.`)) return;
            await api(`/products/api/${id}`, { method: 'DELETE' });
            showToast('Produk berhasil dihapus');
            loadProducts();
        }

        async function showStock(productId, name) {
            document.getElementById('stockProductId').value = productId;
            document.getElementById('stockModalTitle').textContent = `Stok: ${name}`;
            document.getElementById('stockData').value = '';
            openModal('stockModal');
            loadStockList(productId);
        }

        async function loadStockList(productId) {
            const stocks = await api(`/products/api/${productId}/stock`);
            const list = document.getElementById('stockList');
            if (stocks.length === 0) {
                list.innerHTML = '<p style="color:var(--text-secondary);font-size:13px;">Tidak ada stok</p>';
                return;
            }
            list.innerHTML = stocks.map(s => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-color);font-size:13px;">
                    <span style="word-break:break-all;flex:1;margin-right:8px;">${s.data}</span>
                    <button class="btn btn-sm btn-danger" onclick="deleteStock(${s.id}, ${productId})">×</button>
                </div>
            `).join('');
        }

        async function addStock() {
            const productId = document.getElementById('stockProductId').value;
            const stocks = document.getElementById('stockData').value;
            if (!stocks.trim()) return showToast('Data stok wajib diisi', 'error');
            await api(`/products/api/${productId}/stock`, { method: 'POST', body: JSON.stringify({ stocks }) });
            showToast('Stok berhasil ditambahkan');
            document.getElementById('stockData').value = '';
            loadStockList(productId);
            loadProducts();
        }

        async function deleteStock(stockId, productId) {
            await api(`/products/api/stock/${stockId}`, { method: 'DELETE' });
            showToast('Stok dihapus');
            loadStockList(productId);
            loadProducts();
        }

        async function deleteAllStock() {
            const productId = document.getElementById('stockProductId').value;
            if (!confirmAction('Hapus SEMUA stok produk ini?')) return;
            await api(`/products/api/${productId}/stock`, { method: 'DELETE' });
            showToast('Semua stok dihapus');
            loadStockList(productId);
            loadProducts();
        }

        loadCategories();
        loadProducts();
    </script>
</body>
</html>
